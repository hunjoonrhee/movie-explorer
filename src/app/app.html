<div>
  <input type="text" placeholder="search..." [formControl]="control" />
  @for (genre of service.getGenres(); track genre) {
    <button (click)="showGenres(genre)">{{ genre }}</button>
  }
  @for (movie of movies; track movie.id) {
    <div>
      <span>{{ movie.title }}</span>
    </div>
  }
</div>
